name: GitHub Daily Radar

# ════════════════════════════════════════════════════════════════════════
# 每天自动发现 GitHub 热门 / 快速增长项目，维护 Star 历史快照，
# 生成 Top20 日报并推送到邮箱。
#
# 与 TrendRadar 原有的 "Get Hot News" (crawler.yml) 完全独立：
# 互不影响，单独启用/停用。
# ════════════════════════════════════════════════════════════════════════

on:
  schedule:
    # ────────────────────────────────────────────────────────────────────
    # ⏰ 每天北京时间 4 次「兜底触发」：08:17 / 08:37 / 08:57 / 09:17
    #
    # 为什么要 4 次？
    # GitHub 官方文档明确说明：schedule 事件在平台高负载时**可能被延迟，
    # 甚至直接丢弃**（"may be delayed or dropped"）。
    # 2026-08-23 08:10 那次就完全没有产生 workflow run。
    # 一天只有一个触发机会 = 那天的日报直接没了，所以改成 4 次。
    #
    # 重复触发不会重复发信：github_radar 有每日幂等状态
    # （data/github_radar/state/YYYY-MM-DD.json，见 github_radar/state.py）
    #   - 快照 + 邮件都成功 → 后面 3 次直接正常退出（status=skipped）
    #   - 快照成功但邮件失败 → 后面几次继续补发邮件，且不覆盖当天快照
    #
    # timezone 是 GitHub Actions 现已支持的官方字段（IANA 时区名），
    # 因此这里直接写北京时间，不再手工换算 UTC。
    # Asia/Shanghai 不实行夏令时，全年偏移恒为 UTC+8。
    #
    # 注意：定时任务只会在**默认分支（master）**上触发；
    # 在其它分支上只能用下面的 "Run workflow" 手动运行
    # （手动运行同样默认遵守幂等，除非勾选 force_run）。
    # ────────────────────────────────────────────────────────────────────
    - cron: "17 8 * * *"
      timezone: "Asia/Shanghai"
    - cron: "37 8 * * *"
      timezone: "Asia/Shanghai"
    - cron: "57 8 * * *"
      timezone: "Asia/Shanghai"
    - cron: "17 9 * * *"
      timezone: "Asia/Shanghai"

  # 手动运行（用于首次验证 / 排查问题）
  workflow_dispatch:
    inputs:
      force_run:
        description: "强制运行：忽略当天已完成状态，重跑并**重复发送**邮件（不勾选则同样遵守每日幂等）"
        type: boolean
        default: false
      skip_email:
        description: "只跑数据、不发邮件（调试用）"
        type: boolean
        default: false
      skip_commit:
        description: "不把快照提交回仓库（调试用）"
        type: boolean
        default: false

# 只申请必要权限：写回每日快照
permissions:
  contents: write

# 防止上一次还没跑完就被下一次覆盖（不取消正在进行的运行，避免提交中途被打断）
concurrency:
  group: github-radar-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Run GitHub Daily Radar
        id: radar
        env:
          # Actions 自动提供的 token，无需用户额外创建 PAT
          GITHUB_TOKEN: ${{ github.token }}
          # 邮件配置全部来自 Repository Secrets，绝不写在代码里
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          PYTHONIOENCODING: "utf-8"
          # github_radar 是仓库根目录下的独立包（同 mcp_server），
          # 显式加上 PYTHONPATH，避免依赖「-m 会把当前目录加入 sys.path」这一隐式行为
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -e

          # schedule 触发时 inputs.* 全部为空字符串，三个开关都不会生效；
          # 手动运行时 force_run 也默认为 false。
          # 也就是说无论怎么触发，默认都是「按当天状态决定跑还是跳过」，
          # 只有明确勾选 force_run 才会绕过幂等重复发信。
          ARGS=""

          if [ "${{ inputs.skip_email }}" = "true" ]; then
            echo "::notice::本次手动运行不发送邮件"
            ARGS="${ARGS} --no-email"
          fi

          if [ "${{ inputs.force_run }}" = "true" ]; then
            echo "::notice::force_run：忽略当天状态，强制完整运行"
            ARGS="${ARGS} --force-run"
          fi

          uv run python -m github_radar ${ARGS}

      # 报告文件（HTML/TXT）留作调试用，7 天后自动过期；不会提交进仓库
      - name: Upload report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: github-radar-report
          path: output/github_radar/
          retention-days: 7
          if-no-files-found: ignore

      # ────────────────────────────────────────────────────────────────
      # 提交快照 + 每日状态
      #
      # 用 !cancelled() 而不是 success()：即使邮件发送失败（上一步退出码 1），
      # 当天的 Star 快照和状态文件也必须提交——
      #   - 快照不提交 → 明天算不出 24h 增量
      #   - 状态不提交 → 下一次兜底触发读不到 snapshot_completed，
      #                  会重新覆盖当天快照，「一天一个正式版本」就失效了
      # 上一步的失败仍会让整个 job 显示为 failed。
      #
      # 被跳过的触发（status=skipped）什么都不写，这里自然是 nothing to commit。
      # ────────────────────────────────────────────────────────────────
      - name: Commit snapshot
        if: ${{ !cancelled() && inputs.skip_commit != true }}
        env:
          SNAPSHOT_DATE: ${{ steps.radar.outputs.snapshot_date }}
          SNAPSHOT_STATUS: ${{ steps.radar.outputs.snapshot }}
        run: |
          set -e

          if [ ! -d data/github_radar ]; then
            echo "没有生成快照目录，跳过提交"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # -A 让过期快照的删除也一并入库（保留策略生效）
          git add -A data/github_radar

          if git diff --cached --quiet; then
            echo "nothing to commit（快照没有变化）"
            exit 0
          fi

          DATE="${SNAPSHOT_DATE:-$(TZ=Asia/Shanghai date +%F)}"

          # 补发邮件的那次运行不会重写快照，只更新状态文件——提交信息如实反映
          if [ "${SNAPSHOT_STATUS}" = "written" ]; then
            git commit -m "chore(github-radar): snapshot ${DATE}"
          else
            git commit -m "chore(github-radar): radar state ${DATE}"
          fi

          BRANCH="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "push 成功"
              exit 0
            fi
            echo "push 失败（第 ${attempt} 次），尝试 rebase 后重试（绝不 force push）"
            git pull --rebase --autostash origin "${BRANCH}" || true
            sleep $((attempt * 5))
          done

          echo "::error::快照提交失败：远端可能有冲突，请手动检查"
          exit 1

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### 🛰️ GitHub Daily Radar"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 状态 | ${{ steps.radar.outputs.status || 'unknown' }} |"
            echo "| 快照日期 | ${{ steps.radar.outputs.snapshot_date || '-' }} |"
            echo "| 候选仓库数 | ${{ steps.radar.outputs.repo_count || '-' }} |"
            echo "| 快照 | ${{ steps.radar.outputs.snapshot || '-' }} |"
            echo "| 邮件 | ${{ steps.radar.outputs.email || '-' }} |"
            echo "| 当日完成时间 | ${{ steps.radar.outputs.completed_at || '-' }} |"
            echo ""
            echo "状态含义：\`ok\` 本次完成 · \`skipped\` 当天已完成、兜底触发正常退出 ·"
            echo "\`email_failed\` 快照已存、邮件待下次兜底补发 · \`failed\` 采集失败"
          } >> "$GITHUB_STEP_SUMMARY"
